spring:
  application:
    name: mentortrack-backend
  profiles:
    active: demo

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: 8080

mentortrack:
  jwt:
    # Demo-only secret. MUST be overridden via MENTORTRACK_JWT_SECRET env var in any real deployment.
    secret: ${MENTORTRACK_JWT_SECRET:demo-only-insecure-secret-change-me-before-any-real-deployment-0123456789}
    expiration-minutes: 480
  storage:
    # Local encrypted document storage root.
    root-dir: ${MENTORTRACK_STORAGE_DIR:./storage}
    # AES key for at-rest encryption of uploaded documents. MUST be overridden in any real deployment.
    encryption-key: ${MENTORTRACK_STORAGE_KEY:demo-only-insecure-storage-key-32bytes!!}
  ocr:
    # Path to the directory containing eng.traineddata. If this path is wrong or Tesseract isn't
    # installed, OCR upload endpoints now return a clear 503 with an actionable message instead of
    # crashing the app (see OcrService for details on why that fix was needed).
    # Common tessdata locations by platform, if the default below doesn't match your machine:
    #   Debian/Ubuntu (apt-get install tesseract-ocr):      /usr/share/tesseract-ocr/5/tessdata
    #                                                    or  /usr/share/tesseract-ocr/4.00/tessdata
    #   macOS (brew install tesseract):                     /opt/homebrew/share/tessdata
    #                                                    or  /usr/local/share/tessdata (Intel Macs)
    #   Windows (default installer path):                   C:\Program Files\Tesseract-OCR\tessdata
    # Find yours with: find / -name "eng.traineddata" 2>/dev/null   (or `locate eng.traineddata`)
    tessdata-path: ${MENTORTRACK_TESSDATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
  pdf:
    template-page1: templates/mentor-card-page1.pdf
    template-page2: templates/mentor-card-page2.pdf
  seed:
    enabled: true
